<!doctype html><html><body style="margin:0;background:#0B0E11">
<canvas id="c" width="640" height="560"></canvas>
<script src="../docs/js/three.min.js"></script>
<script src="../docs/js/body.js"></script><script src="../docs/js/engine.js"></script>
<script>
const MOVES = (new URLSearchParams(location.search).get('m')||'core').split(',');
for(const m of MOVES) document.write(`<script src="../docs/moves/${m}.js"><\/script>`);
</script>
<script>
const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, preserveDrawingBuffer:true});
r.shadowMap.enabled = true; r.setClearColor(0x151A20); r.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xF2F5FF, 0x262B32, .95));
const dl = new THREE.DirectionalLight(0xffffff, 1.25); dl.position.set(1.8,4,2.6); dl.castShadow = true; dl.shadow.mapSize.set(1024,1024);
Object.assign(dl.shadow.camera,{left:-2.6,right:2.6,top:2.6,bottom:-2.6,near:.5,far:12}); dl.shadow.bias=-.0006; scene.add(dl);
const rim = new THREE.DirectionalLight(0xFFC9BA, .5); rim.position.set(-2.5,2.4,-2); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.MeshStandardMaterial({color:0x161B20, roughness:1})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid = new THREE.GridHelper(6, 12, 0x2E3640, 0x262D35); grid.position.y=.001; scene.add(grid);
const m = Rig.build(scene, BODY);
const cam = new THREE.PerspectiveCamera(30, 640/560, .05, 50);
// shot(nom, s, opts, az, tx, ty, dist, el, tz, label)
window.shot = (name, s, opts, az, tx, ty, dist, el=12, tz=0, t=0)=>{
  if(dist === 'auto'){ const m = Rig.META[name] || {}; const f = (typeof m.frame === 'function' ? m.frame(opts||{}) : m.frame) || {tx:0,ty:.9,H:2.1,W:1.6};
    const need = Math.max(f.H, f.W/(640/560)); dist = need/2/Math.tan(15*Math.PI/180)*1.06; tx = f.tx; ty = f.ty; tz = f.tz||0; el = f.el ?? 9; if(az == null) az = f.az ?? 36; }
  const p = Rig.P[name](s, opts||{}, t); m.setFocus(p.focus, true); m.update(p);
  const a = az*Math.PI/180, e = el*Math.PI/180;
  cam.position.set(tx + dist*Math.sin(a)*Math.cos(e), ty + dist*Math.sin(e), tz + dist*Math.cos(a)*Math.cos(e));
  cam.lookAt(tx, ty, tz); r.render(scene, cam);
};
window.ready = true;
</script></body></html>
