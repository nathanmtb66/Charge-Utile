<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banque d’exercices · Charge Utile</title>
<meta name="theme-color" content="#0B0E11">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<style>
body{padding:0 16px}
.cat{max-width:1100px;margin:0 auto;padding-block:20px 40px;display:grid;gap:16px}
.cat h1{margin:0;font-family:var(--d);font-weight:700;font-size:44px;text-transform:uppercase;line-height:1}
.cat .sub{margin:4px 0 0;color:var(--dim)}
.tools{display:grid;gap:10px}
.tools .field{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{height:34px;padding:0 12px;border-radius:99px;background:var(--s1);color:var(--dim);font-size:13.5px}
.tags button.on{background:var(--ink);color:var(--bg)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:18px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.viewer{position:static!important}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ex{display:grid;gap:4px;align-content:start;text-align:left;background:var(--s1);border-radius:14px;padding:12px 14px}
.ex.on{box-shadow:inset 0 0 0 2px var(--acc)}
.ex b{font-weight:600;line-height:1.25}
.ex small{color:var(--dim);font-size:12.5px}
.ex .chipline{display:flex;flex-wrap:wrap;gap:4px}
.ex .chipline i{font-style:normal;font-size:11px;color:var(--dim);background:var(--s2);border-radius:99px;padding:2px 7px}
.viewer{position:sticky;top:12px;display:grid;gap:10px;background:var(--s1);border-radius:20px;padding:12px}
.viewer .stage{margin:0;height:380px;flex:none}
.viewer h2{margin:0;font-family:var(--d);font-size:28px;text-transform:uppercase;line-height:1.05}
.viewer .meta{color:var(--dim);font-size:13.5px}
.viewer ul{margin:0;padding-left:18px}
.viewer .id{font-family:var(--m);font-size:12px;color:var(--faint)}
.count{color:var(--dim);font-size:13.5px}
</style>
</head>
<body>
<div class="cat">
  <div><h1>Banque d’exercices</h1><p class="sub">Tous les exercices que Claude peut mettre dans une séance. Clique pour voir le mouvement.</p></div>
  <div class="tools">
    <input class="field" id="q" placeholder="Chercher : fente, genou, gainage…" autocomplete="off">
    <div class="tags" id="tags"></div>
    <p class="count" id="count"></p>
  </div>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <aside class="viewer" id="viewer">
      <section class="stage" id="stage"><canvas id="gl"></canvas></section>
      <div id="info"></div>
    </aside>
  </div>
</div>
<script src="js/three.min.js"></script>
<script src="js/body.js"></script>
<script src="js/engine.js"></script>
<script src="moves/core.js"></script>
<script src="moves/legs.js"></script>
<script src="moves/posterior.js"></script>
<script src="moves/balance.js"></script>
<script src="moves/trunk.js"></script>
<script src="moves/upper.js"></script>
<script src="moves/ankle.js"></script>
<script src="moves/velomob.js"></script>
<script src="moves/stretch.js"></script>
<script src="moves/trailmob.js"></script>
<script src="moves/shoulder.js"></script>
<script src="moves/extra.js"></script>
<script>
(async function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const EX = window.CU_DATA ? window.CU_DATA.exercises : await (await fetch('data/exercises.json')).json();
  const TAGS = {'mobilite':'Mobilité','etirement':'Étirement','recuperation':'Récup','velo':'Vélo','trail':'Trail','genou':'Genou','cheville':'Cheville','hanche':'Hanche','dos':'Dos','proprio':'Proprio','descente-vtt':'Descente VTT','coup-de-pedale':'Coup de pédale','foulee':'Foulée','montee':'Montée','explosivite':'Explosivité','gainage':'Gainage','chaine-posterieure':'Chaîne postérieure','haut-du-corps':'Haut du corps','echauffement':'Échauffement','cardio':'Cardio','retour-au-calme':'Retour au calme'};
  const TYPE = {reps:'répétitions', hold:'tenue', plyo:'pliométrie', effort:'effort max', cardio:'cardio'};
  const EXV = EX.filter(x => x.valide !== false);
  let tag = null, sel = null;
  $('#tags').innerHTML = Object.entries(TAGS).map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('');
  document.querySelectorAll('#tags button').forEach(b => b.onclick = () => { tag = tag === b.dataset.t ? null : b.dataset.t; document.querySelectorAll('#tags button').forEach(x => x.classList.toggle('on', x.dataset.t === tag)); render(); });
  $('#q').oninput = render;
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  function render(){
    const q = norm($('#q').value.trim());
    const list = EXV.filter(x => (!tag || x.tags.includes(tag)) && (!q || norm([x.nom, x.id, x.musclesTxt, x.famille, ...(x.tags||[])].join(' ')).includes(q)));
    $('#count').textContent = `${list.length} exercice${list.length>1?'s':''}`;
    $('#grid').innerHTML = list.map(x => `<button class="ex${sel && sel.id===x.id ? ' on':''}" data-id="${x.id}"><b>${esc(x.nom)}</b><small>${esc(x.musclesTxt || '')}</small><span class="chipline">${x.tags.slice(0,3).map(t=>`<i>${esc(TAGS[t]||t)}</i>`).join('')}</span></button>`).join('');
    document.querySelectorAll('.ex').forEach(b => b.onclick = () => show(EX.find(x => x.id === b.dataset.id)));
  }
  // scène
  const el = $('#stage'), glc = $('#gl');
  const renderer = new THREE.WebGLRenderer({canvas:glc, antialias:true, alpha:true});
  renderer.shadowMap.enabled = true; renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0,0);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xF2F5FF, 0x262B32, .95));
  const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(1.8,4,2.6); key.castShadow = true; key.shadow.mapSize.set(1024,1024); Object.assign(key.shadow.camera,{left:-2.8,right:2.8,top:2.8,bottom:-2.8}); scene.add(key);
  const rim = new THREE.DirectionalLight(0xFFC9BA, .5); rim.position.set(-2.5,2.4,-2); scene.add(rim);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(12,12), new THREE.ShadowMaterial({opacity:.34})); sh.rotation.x = -Math.PI/2; sh.receiveShadow = true; scene.add(sh);
  const rig = Rig.build(scene, BODY);
  const cam = new THREE.PerspectiveCamera(28, 1, .05, 40);
  let W = 1, H = 1, tl = null, t0 = performance.now(), az = 36, drag = null;
  new ResizeObserver(()=>{ const r = el.getBoundingClientRect(); W = r.width; H = r.height; renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(W, H, false); cam.aspect = W/H; cam.updateProjectionMatrix(); }).observe(el);
  el.addEventListener('pointerdown', e => { drag = e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if(drag == null) return; az -= (e.clientX - drag)*.5; drag = e.clientX; });
  el.addEventListener('pointerup', () => drag = null);
  const frameOf = x => { const m = Rig.META[x.anim] || {}; return (typeof m.frame === 'function' ? m.frame(x.opts||{}) : m.frame) || {tx:0,ty:.9,H:2.1,W:1.6,az:36}; };
  function show(x){
    sel = x; const m = Rig.META[x.anim] || {};
    const tp = typeof m.tempo === 'function' ? m.tempo(x.opts||{}) : m.tempo;
    tl = tp ? Rig.tempoTimeline(x.tempoConseille || ['2','1','1','0']) : Rig.cycleTimeline(m.cycle || 3);
    t0 = performance.now(); az = frameOf(x).az ?? 36;
    rig.setFocus(x.muscles);
    $('#info').innerHTML = `<h2>${esc(x.nom)}</h2><p class="meta">${esc(TYPE[x.type])} · niveau ${x.niveau} · ${esc((x.materiel||[]).join(', '))}${x.progression ? ` · progression ${esc(x.progression.groupe)} ${x.progression.niveau}/4` : ''}</p>
      <p>${esc(x.pourquoi)}</p><ul>${x.consignes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
      ${x.voirEnVrai ? `<a class="mbtn" href="${esc(x.voirEnVrai)}" target="_blank" rel="noopener">Voir la vidéo fitnessprogramer</a>` : ''}
      <p class="id">id : ${esc(x.id)}</p>`;
    render();
  }
  function loop(now){
    if(sel){
      const t = (now - t0)/1000, r = tl.at(t);
      rig.update(Rig.P[sel.anim](r.s, sel.opts||{}, t));
      const f = frameOf(sel), need = Math.max(f.H, f.W/(W/H)), dist = need/2/Math.tan(14*Math.PI/180)*1.06;
      const a = az*Math.PI/180, e = (f.el ?? 9)*Math.PI/180, tz = f.tz || 0;
      cam.position.set(f.tx + dist*Math.sin(a)*Math.cos(e), f.ty + dist*Math.sin(e), tz + dist*Math.cos(a)*Math.cos(e));
      cam.lookAt(f.tx, f.ty, tz); renderer.render(scene, cam);
    }
    requestAnimationFrame(loop);
  }
  show(EX.find(x => x.id === 'etoile-plots') || EX[0]);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
