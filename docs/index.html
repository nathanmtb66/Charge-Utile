<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Charge Utile</title>
<meta name="description" content="Tes séances de muscu préparées par Nathan, guidées pas à pas.">
<meta name="theme-color" content="#0B0E11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Charge Utile">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
<div id="app" class="home">
  <header class="top">
    <div class="segs" id="segs" aria-hidden="true"></div>
    <div class="row">
      <button class="round off" id="btnQuit" aria-label="Quitter la séance"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="tt"><span class="kicker" id="kicker"></span><h1 id="title">Charge Utile</h1></div>
      <button class="round off" id="btnInfo" aria-label="Comprendre l'exercice"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
  </header>
  <section class="stage" id="stage" hidden aria-label="Démonstration 3D de l'exercice">
    <canvas id="gl"></canvas>
    <video id="camv" playsinline muted hidden></video>
    <div class="hud idle" id="hud"></div>
    <div class="hint" id="hint">Glisse pour tourner</div>
    <button class="viewbtn" id="btnView" aria-label="Changer l'angle de vue"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span id="viewLbl">3/4</span></button>
  </section>
  <div class="page" id="page"></div>
  <main class="panel" id="panel" hidden></main>
  <button class="scrolldown" id="scrolldown" aria-label="Voir la suite"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <footer class="bar" id="bar"></footer>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détails" hidden><div id="sheetBody"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="camfile" accept="video/*" capture="environment" hidden>
</div>
<p class="note">Charge Utile · séances préparées par Nathan</p>
</div>

<script src="js/three.min.js"></script>
<script src="js/body.js"></script>
<script src="js/engine.js"></script>
<script src="moves/core.js"></script>
<script src="moves/legs.js"></script>
<script src="moves/posterior.js"></script>
<script src="moves/balance.js"></script>
<script src="moves/trunk.js"></script>
<script src="moves/upper.js"></script>
<script src="moves/ankle.js"></script>
<script src="moves/velomob.js"></script>
<script src="moves/stretch.js"></script>
<script src="moves/trailmob.js"></script>
<script src="moves/shoulder.js"></script>
<script src="moves/extra.js"></script>
<script src="js/app.js"></script>
</body>
</html>
